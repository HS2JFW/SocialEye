version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: socialeye_postgres
    restart: always
    environment:
      POSTGRES_DB: socialeye
      POSTGRES_USER: socialeye
      POSTGRES_PASSWORD: socialeye_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialeye -d socialeye"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: socialeye_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  neo4j:
    image: neo4j:5-community
    container_name: socialeye_neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/socialeye_secret
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4jdata:/data
    expose:
      - "7474"
      - "7687"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialeye_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://socialeye:socialeye_secret@postgres:5432/socialeye
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=socialeye_secret
      - LITELLM_ENDPOINT=${LITELLM_ENDPOINT:-https://llm.addpay.in.th/v1}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MODEL=${LITELLM_MODEL:-gemma-4-31b-it}
      - LITELLM_EMBEDDING_MODEL=${LITELLM_EMBEDDING_MODEL:-embeded}
      - ALLOWED_ORIGINS=*
    extra_hosts:
      - "llm.addpay.in.th:host-gateway"
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: socialeye_frontend
    restart: always
    depends_on:
      - backend
    expose:
      - "80"
    ports:
      - "3880:80"

volumes:
  pgdata:
  redisdata:
  neo4jdata:
